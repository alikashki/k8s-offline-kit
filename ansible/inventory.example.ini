# inventory.example.ini — copy to inventory.ini (git-ignored) and fill in YOUR addresses and credentials.
#   cp inventory.example.ini inventory.ini

# inventory.ini — machines, their ROLE (= group) and login credentials.
#
# Two addresses per host:
#   ansible_host = the address Ansible SSHes to (e.g. the NAT address you can reach from this machine)
#   node_ip      = the INTERNAL address the nodes use to talk to each other (goes into /etc/hosts,
#                  haproxy backends, kubelet --node-ip, apiserver advertise address)
#
# Rules:
#  * host names (the first word on each line) become the real hostnames AND the names in /etc/hosts
#  * control-plane hosts MUST be named cp1, cp2, ... (haproxy backends are generated from these names)
#  * exactly 1 host in lb_master, 1 in lb_slave, 1 in cp_first; any number in cp_other / workers
#  * order of execution is fixed by site.yml; you only declare WHICH machine plays WHICH role

#lb1 ansible_host=<IP for ssh to host> node_ip=<IP in cluster>
[lb_master]
lb1 ansible_host=192.168.10.11 node_ip=192.168.10.11

[lb_slave]
lb2 ansible_host=192.168.10.12 node_ip=192.168.10.12

[cp_first]
cp1 ansible_host=192.168.10.21 node_ip=192.168.10.21

[cp_other]
cp2 ansible_host=192.168.10.22 node_ip=192.168.10.22
cp3 ansible_host=192.168.10.23 node_ip=192.168.10.23

[workers]
worker1 ansible_host=192.168.10.31 node_ip=192.168.10.31
worker2 ansible_host=192.168.10.32 node_ip=192.168.10.32
worker3 ansible_host=192.168.10.33 node_ip=192.168.10.33

# ---- derived groups (do not edit) ----
[lb:children]
lb_master
lb_slave

[control_plane:children]
cp_first
cp_other

[k8s:children]
control_plane
workers

# ---- credentials (same for all hosts; override per host on its line if needed) ----
# Tip: encrypt secrets with ansible-vault instead of keeping them in clear text.
[all:vars]
ansible_user=CHANGE_ME
ansible_password=CHANGE_ME
# sudo password. If ansible_user is root, set ansible_become=false and delete the next line.
ansible_become=true
ansible_become_method=sudo
ansible_become_password=CHANGE_ME
