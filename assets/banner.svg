<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="title">k8s-offline-kit</title>
  <desc id="desc">Air-gapped, highly available Kubernetes on Debian 13 with kubeadm, containerd, Cilium, HAProxy, keepalived and Ansible.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0f1f"/><stop offset="1" stop-color="#182a55"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4ea1ff"/><stop offset="1" stop-color="#9b6bff"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.79" cy="0.50" r="0.42">
      <stop offset="0" stop-color="#4ea1ff" stop-opacity="0.42"/><stop offset="1" stop-color="#4ea1ff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.3" fill="#ffffff" fill-opacity="0.08"/>
    </pattern>
    <clipPath id="card"><rect width="1200" height="320" rx="20"/></clipPath>
  </defs>
  <style>
    .f { font-family: 'Segoe UI', Inter, Roboto, Helvetica, Arial, sans-serif; }
    .eyebrow { font-size: 15px; font-weight: 700; letter-spacing: 4px; fill: #6fb3ff; }
    .title { font-size: 66px; font-weight: 800; fill: #ffffff; letter-spacing: -1px; }
    .sub { font-size: 25px; fill: #b9c6e6; }
    .chip { font-size: 14px; font-weight: 600; fill: #dbe6ff; }
    .tiny { font-size: 12px; fill: #8fa3d6; letter-spacing: 1px; }
  </style>

  <g clip-path="url(#card)">
    <rect width="1200" height="320" fill="url(#bg)"/>
    <rect width="1200" height="320" fill="url(#dots)"/>
    <rect width="1200" height="320" fill="url(#glow)"/>
    <rect y="302" width="1200" height="18" fill="url(#accent)"/>
  </g>

  <!-- text -->
  <text class="f eyebrow" x="62" y="72">OFFLINE  ·  HIGH AVAILABILITY  ·  AUTOMATED</text>
  <text class="f title" x="60" y="146">k8s-<tspan fill="url(#accent)">offline</tspan>-kit</text>
  <text class="f sub" x="62" y="190">Air-gapped Kubernetes HA cluster on Debian 13</text>

  <g class="f chip">
    <rect x="60"  y="222" width="86"  height="34" rx="17" fill="#ffffff" fill-opacity="0.09" stroke="#6fb3ff" stroke-opacity="0.45"/><text x="103"  y="244" text-anchor="middle">kubeadm</text>
    <rect x="156" y="222" width="112" height="34" rx="17" fill="#ffffff" fill-opacity="0.09" stroke="#6fb3ff" stroke-opacity="0.45"/><text x="212"  y="244" text-anchor="middle">containerd</text>
    <rect x="278" y="222" width="78"  height="34" rx="17" fill="#ffffff" fill-opacity="0.09" stroke="#6fb3ff" stroke-opacity="0.45"/><text x="317"  y="244" text-anchor="middle">Cilium</text>
    <rect x="366" y="222" width="90"  height="34" rx="17" fill="#ffffff" fill-opacity="0.09" stroke="#6fb3ff" stroke-opacity="0.45"/><text x="411"  y="244" text-anchor="middle">HAProxy</text>
    <rect x="466" y="222" width="112" height="34" rx="17" fill="#ffffff" fill-opacity="0.09" stroke="#6fb3ff" stroke-opacity="0.45"/><text x="522"  y="244" text-anchor="middle">keepalived</text>
    <rect x="588" y="222" width="88"  height="34" rx="17" fill="#ffffff" fill-opacity="0.09" stroke="#6fb3ff" stroke-opacity="0.45"/><text x="632"  y="244" text-anchor="middle">Ansible</text>
  </g>

  <!-- cluster graphic -->
  <g transform="translate(960 160)">
    <circle r="132" fill="none" stroke="#ffffff" stroke-opacity="0.14" stroke-dasharray="3 7"/>
    <g stroke="#6fb3ff" stroke-opacity="0.55" stroke-width="1.6">
      <line x1="0" y1="0" x2="91"  y2="52.5"/>
      <line x1="0" y1="0" x2="0"   y2="105"/>
      <line x1="0" y1="0" x2="-91" y2="52.5"/>
      <line x1="0" y1="0" x2="-91" y2="-52.5"/>
      <line x1="0" y1="0" x2="0"   y2="-105"/>
      <line x1="0" y1="0" x2="91"  y2="-52.5"/>
    </g>
    <g fill="#162a58" stroke="#4ea1ff" stroke-width="2">
      <circle cx="91"  cy="52.5"  r="17"/>
      <circle cx="0"   cy="105"   r="17"/>
      <circle cx="-91" cy="52.5"  r="17"/>
      <circle cx="-91" cy="-52.5" r="17"/>
      <circle cx="0"   cy="-105"  r="17"/>
      <circle cx="91"  cy="-52.5" r="17"/>
    </g>
    <g fill="#9b6bff" fill-opacity="0.9">
      <circle cx="91" cy="52.5" r="5"/><circle cx="0" cy="105" r="5"/><circle cx="-91" cy="52.5" r="5"/>
      <circle cx="-91" cy="-52.5" r="5"/><circle cx="0" cy="-105" r="5"/><circle cx="91" cy="-52.5" r="5"/>
    </g>
    <polygon points="46,0 23,39.8 -23,39.8 -46,0 -23,-39.8 23,-39.8" fill="url(#accent)" stroke="#ffffff" stroke-opacity="0.5" stroke-width="2"/>
    <circle r="15" fill="#0a0f1f" fill-opacity="0.85"/>
    <circle r="6" fill="#ffffff"/>
  </g>

  <!-- offline badge -->
  <g transform="translate(1124 56)">
    <circle r="24" fill="#2a1431" stroke="#ff6b81" stroke-width="2"/>
    <g fill="none" stroke="#ffb3be" stroke-width="1.8" stroke-linecap="round">
      <circle r="12"/><ellipse rx="5" ry="12"/><line x1="-12" y1="0" x2="12" y2="0"/>
    </g>
    <line x1="-17" y1="17" x2="17" y2="-17" stroke="#ff6b81" stroke-width="3.4" stroke-linecap="round"/>
  </g>
  <text class="f tiny" x="1124" y="100" text-anchor="middle">NO INTERNET</text>
</svg>
