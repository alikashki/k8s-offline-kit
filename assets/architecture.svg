<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="610" viewBox="0 0 1000 610" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">Cluster topology</title>
  <desc id="d">Two load balancers sharing a keepalived VIP in front of three control-plane nodes, with three workers, Cilium CNI and a metrics-server add-on. An Ansible controller reaches every node over SSH.</desc>
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#4ea1ff"/><stop offset="1" stop-color="#9b6bff"/></linearGradient>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9z" fill="#8fa3d6"/></marker>
  </defs>
  <style>
    .f { font-family: 'Segoe UI', Inter, Roboto, Helvetica, Arial, sans-serif; }
    .t { font-size: 16px; font-weight: 700; fill: #ffffff; }
    .s { font-size: 12px; fill: #b9c6e6; }
    .l { font-size: 12px; fill: #8fa3d6; }
    .ln { stroke: #7f8fc4; stroke-width: 1.8; fill: none; }
  </style>
  <rect width="1000" height="610" rx="20" fill="#0e1630" stroke="#24315e"/>

  <!-- controller + client -->
  <g class="f">
    <rect x="40" y="34" width="230" height="64" rx="12" fill="#1c2547" stroke="#3a4a82"/>
    <text class="t" x="155" y="62" text-anchor="middle">Ansible controller</text>
    <text class="s" x="155" y="82" text-anchor="middle">site.yml · metrics-server.yml</text>

    <rect x="730" y="34" width="230" height="64" rx="12" fill="#1c2547" stroke="#3a4a82"/>
    <text class="t" x="845" y="62" text-anchor="middle">kubectl · k9s · HPA</text>
    <text class="s" x="845" y="82" text-anchor="middle">Kubernetes API clients</text>
  </g>

  <!-- VIP -->
  <rect x="360" y="120" width="280" height="44" rx="22" fill="url(#accent)"/>
  <text class="f t" x="500" y="148" text-anchor="middle">VIP 192.168.10.10 : 6443</text>
  <path class="ln" d="M845 98 V142 H642" marker-end="url(#arr)"/>

  <!-- LBs -->
  <path class="ln" d="M395 164 V196"/><path class="ln" d="M605 164 V196"/>
  <g class="f">
    <rect x="280" y="196" width="190" height="76" rx="12" fill="#2a1f55" stroke="#9b6bff" stroke-width="1.6"/>
    <text class="t" x="375" y="226" text-anchor="middle">lb1 · MASTER</text>
    <text class="s" x="375" y="248" text-anchor="middle">haproxy + keepalived</text>
    <rect x="530" y="196" width="190" height="76" rx="12" fill="#2a1f55" stroke="#9b6bff" stroke-width="1.6"/>
    <text class="t" x="625" y="226" text-anchor="middle">lb2 · BACKUP</text>
    <text class="s" x="625" y="248" text-anchor="middle">haproxy + keepalived</text>
    <text class="l" x="500" y="228" text-anchor="middle">VRRP</text>
  </g>
  <path d="M470 236 H530" stroke="#9b6bff" stroke-width="1.8" stroke-dasharray="4 4" fill="none"/>

  <!-- bus LB -> CPs -->
  <path class="ln" d="M375 272 V300 M625 272 V300 M270 300 H730 M270 300 V330 M500 300 V330 M730 300 V330"/>
  <text class="f l" x="500" y="292" text-anchor="middle">tcp :6443 · round-robin · health-checked</text>

  <!-- Cilium band -->
  <rect x="140" y="314" width="720" height="262" rx="16" fill="none" stroke="#4ea1ff" stroke-opacity="0.55" stroke-dasharray="6 6"/>
  <text class="f l" x="500" y="568" text-anchor="middle">Cilium CNI · Pod CIDR 10.244.0.0/16 · node IPs on the internal network</text>

  <!-- control planes -->
  <g class="f">
    <rect x="170" y="334" width="200" height="84" rx="12" fill="#14305e" stroke="#4ea1ff" stroke-width="1.6"/>
    <text class="t" x="270" y="362" text-anchor="middle">cp1</text>
    <text class="s" x="270" y="383" text-anchor="middle">kube-apiserver · etcd</text>
    <text class="s" x="270" y="400" text-anchor="middle">scheduler · controller-mgr</text>

    <rect x="400" y="334" width="200" height="84" rx="12" fill="#14305e" stroke="#4ea1ff" stroke-width="1.6"/>
    <text class="t" x="500" y="362" text-anchor="middle">cp2</text>
    <text class="s" x="500" y="383" text-anchor="middle">kube-apiserver · etcd</text>
    <text class="s" x="500" y="400" text-anchor="middle">scheduler · controller-mgr</text>

    <rect x="630" y="334" width="200" height="84" rx="12" fill="#14305e" stroke="#4ea1ff" stroke-width="1.6"/>
    <text class="t" x="730" y="362" text-anchor="middle">cp3</text>
    <text class="s" x="730" y="383" text-anchor="middle">kube-apiserver · etcd</text>
    <text class="s" x="730" y="400" text-anchor="middle">scheduler · controller-mgr</text>
  </g>

  <!-- workers -->
  <g class="f">
    <rect x="170" y="456" width="200" height="76" rx="12" fill="#0f3b3a" stroke="#2dd4bf" stroke-width="1.6"/>
    <text class="t" x="270" y="484" text-anchor="middle">worker1</text>
    <text class="s" x="270" y="505" text-anchor="middle">kubelet · containerd</text>
    <text class="s" x="270" y="521" text-anchor="middle">Cilium agent</text>

    <rect x="400" y="456" width="200" height="76" rx="12" fill="#0f3b3a" stroke="#2dd4bf" stroke-width="1.6"/>
    <text class="t" x="500" y="484" text-anchor="middle">worker2</text>
    <text class="s" x="500" y="505" text-anchor="middle">kubelet · containerd</text>
    <text class="s" x="500" y="521" text-anchor="middle">Cilium agent</text>

    <rect x="630" y="456" width="200" height="76" rx="12" fill="#0f3b3a" stroke="#2dd4bf" stroke-width="1.6"/>
    <text class="t" x="730" y="484" text-anchor="middle">worker3</text>
    <text class="s" x="730" y="505" text-anchor="middle">kubelet · containerd</text>
    <text class="s" x="730" y="521" text-anchor="middle">Cilium agent</text>
  </g>

  <!-- metrics-server add-on -->
  <g class="f">
    <rect x="880" y="456" width="96" height="76" rx="12" fill="#3a2a10" stroke="#f59e0b" stroke-width="1.6"/>
    <text class="t" x="928" y="484" text-anchor="middle" style="font-size:13px">metrics-</text>
    <text class="t" x="928" y="500" text-anchor="middle" style="font-size:13px">server</text>
    <text class="s" x="928" y="521" text-anchor="middle">add-on</text>
  </g>
  <path d="M880 494 H836" stroke="#f59e0b" stroke-width="1.6" stroke-dasharray="4 4" fill="none" marker-end="url(#arr)"/>

  <!-- SSH rail -->
  <g class="f">
    <path d="M72 98 V586" stroke="#f59e0b" stroke-width="1.6" stroke-dasharray="5 5" fill="none"/>
    <path d="M72 234 H280 M72 376 H170 M72 494 H170" stroke="#f59e0b" stroke-opacity="0.8" stroke-width="1.4" stroke-dasharray="3 5" fill="none" marker-end="url(#arr)"/>
    <text class="l" transform="translate(54 340) rotate(-90)" text-anchor="middle">SSH (management / NAT address)</text>
  </g>
</svg>
